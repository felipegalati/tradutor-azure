<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tradutor em Tempo Real</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; font-size: 16px; }
        .select-group { margin-bottom: 15px; }
        select { padding: 5px; margin-right: 15px; font-size: 14px; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 4px; font-size: 16px; min-height: 40px; }
        .status { font-size: 12px; color: #666; font-style: italic; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>Tradutor Automático em Tempo Real</h2>

    <textarea id="texto" placeholder="Comece a digitar aqui..."></textarea>

    <div class="select-group">
        <label for="fromLang">De:</label>
        <select id="fromLang" onchange="acionarTraducao()">
            <option value="en">Inglês</option>
            <option value="pt">Português</option>
            <option value="es">Espanhol</option>
        </select>

        <label for="toLang">Para:</label>
        <select id="toLang" onchange="acionarTraducao()">
            <option value="pt" selected>Português</option>
            <option value="en">Inglês</option>
            <option value="es">Espanhol</option>
        </select>
    </div>

    <div id="status" class="status"></div>
    <h3>Resultado:</h3>
    <pre id="resultado">Aguardando texto...</pre>

    <script>
        let timeoutId = null;
        let controller = null; // Usado para cancelar requisições antigas

        const textarea = document.getElementById('texto');
        const resultadoPre = document.getElementById('resultado');
        const statusDiv = document.getElementById('status');

        // Dispara a tradução sempre que houver alteração no texto ou nos selects
        textarea.addEventListener('input', acionarTraducao);

        function acionarTraducao() {
            const text = textarea.value.trim();

            // Limpa o timer anterior (Debounce)
            clearTimeout(timeoutId);

            if (!text) {
                resultadoPre.innerText = "Aguardando texto...";
                statusDiv.innerText = "";
                return;
            }

            statusDiv.innerText = "Aguardando você terminar de digitar...";

            // Espera 500ms após a última tecla digitada para enviar a requisição
            timeoutId = setTimeout(() => {
                realizarTraducao(text);
            }, 500);
        }

        async function realizarTraducao(text) {
            const from = document.getElementById('fromLang').value;
            const to = document.getElementById('toLang').value;

            // Cancela requisição anterior pendente para evitar sobrecarga ou conflito de respostas
            if (controller) {
                controller.abort();
            }
            controller = new AbortController();

            statusDiv.innerText = "Traduzindo...";

            try {
                const response = await fetch('http://localhost:3000/traduzir', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text, from, to }),
                    signal: controller.signal
                });

                const data = await response.json();
                
                if (data && data[0] && data[0].translations) {
                    let traducaoFormatada = data[0].translations.map(t => t.text).join('\n');
                    resultadoPre.innerText = traducaoFormatada;
                    statusDiv.innerText = "Traduzido com sucesso!";
                } else {
                    resultadoPre.innerText = "Nenhuma tradução retornada.";
                    statusDiv.innerText = "";
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Requisição anterior cancelada.');
                } else {
                    console.error('Erro:', error);
                    statusDiv.innerText = "Erro ao conectar com o servidor.";
                }
            }
        }
    </script>

</body>
</html>
